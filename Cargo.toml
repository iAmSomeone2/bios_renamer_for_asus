[package]
name = "bios_renamer_for_asus"
version = "0.4.0"
authors = ["Brenden Davidson <davidson.brenden15@gmail.com>"]
edition = "2021"
rust-version = "1.75"
license = "MIT"
readme = "README.md"
repository = "https://github.com/iAmSomeone2/bios_renamer_for_asus"
keywords = ["bios", "rename", "asus"]
categories = ["command-line-utilities"]
default-run = "rename-bios"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[profile.release]
opt-level = 'z'
lto = "fat"
strip = true
codegen-units = 1

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"], optional = true }
relm4 = { version = "0.9", default-features = false, features = ["macros", "libadwaita", "gnome_47"], optional = true }

[features]
default = ["cli"]
cli = ["dep:clap"]
gui = ["dep:relm4"]

[[bin]]
name = "rename-bios"
path = "src/cli_main.rs"
required-features = ["cli"]

[[bin]]
name = "rename-bios-gui"
path = "src/gui_main.rs"
required-features = ["gui"]
